name: Publish Plane images to ECR

on:
  workflow_dispatch:

concurrency:
  group: plane-ecr-${{ github.sha }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  validate:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Lightsail configuration
        run: bash deployments/lightsail/test.sh

  publish:
    needs: validate
    name: Publish plane/${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - service: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - service: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - service: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - service: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - service: proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLANE_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: plane-ecr-${{ github.run_id }}

      - name: Check the release tag
        id: image
        shell: bash
        env:
          ECR_REPOSITORY: plane/${{ matrix.service }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$ECR_REPOSITORY:$GITHUB_SHA"
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"

          if result=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>&1); then
            printf 'build=false\n' >> "$GITHUB_OUTPUT"
            echo "Reusing the published image $image ($result)"
          elif [[ "$result" == *'(ImageNotFoundException)'* ]]; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            printf 'build=true\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi

      - name: Check out the release commit
        if: steps.image.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish the image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          printf 'Image `%s`\n\nSet `PLANE_IMAGE_TAG=%s` after all six jobs pass.\n' \
            "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
